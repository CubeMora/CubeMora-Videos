<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <video controls>
    <source src="./video.mp4" type="video/mp4">
  </video>
</body>
</html>
